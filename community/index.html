<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf4ec">
<title>우리 둘의 이야기</title>
<style>
:root{--bg:#fbf4ec;--card:#fffdfa;--ink:#5a4437;--muted:#a28b7b;--pink:#f58f92;--pink-soft:#ffe4e1;--blue:#6f91c5;--line:#f1e2d6;--shadow:0 8px 26px rgba(117,76,48,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:34px}.top{position:sticky;top:0;z-index:10;height:68px;padding:0 18px;background:rgba(251,244,236,.94);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(241,226,214,.65)}.back{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:14px;color:#8a7060;font-size:13px;font-weight:700}.back:active{background:#f5e9df}.back svg{width:18px;height:18px}.top-title{font-size:21px;font-weight:800;letter-spacing:-.06em;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}.heart{width:38px;height:38px;border:1px solid #f3ddd1;border-radius:50%;display:grid;place-items:center;background:#fffaf5;color:#f28b8e}.heart svg{width:19px}.hero{margin:16px 16px 18px;height:166px;border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(135deg,#e7c47d 0%,#f8d9ad 42%,#f9eee1 100%);box-shadow:var(--shadow)}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 22% 22%,rgba(255,255,255,.65) 0 3px,transparent 4px),radial-gradient(circle at 76% 17%,rgba(255,255,255,.6) 0 4px,transparent 5px),linear-gradient(180deg,rgba(255,245,220,.2),rgba(255,194,176,.12))}.sun{position:absolute;width:70px;height:70px;border-radius:50%;background:#fff3bb;right:68px;top:26px;filter:blur(1px);opacity:.85}.hero-copy{position:absolute;left:24px;top:27px;z-index:2}.hero-copy small{font-size:12px;font-weight:800;letter-spacing:.03em;color:#8f6650}.hero-copy h1{font-size:27px;line-height:1.25;margin:7px 0 0;letter-spacing:-.08em}.hero-copy p{margin:7px 0 0;font-size:12px;color:#8f7665}.couple{position:absolute;right:12px;bottom:-4px;display:flex;align-items:flex-end;gap:0}.bear,.bunny{position:relative;width:93px;height:128px}.head{position:absolute;width:73px;height:70px;border-radius:48% 48% 45% 45%;top:15px;left:10px;box-shadow:inset 0 -4px 8px rgba(120,75,38,.08)}.bear .head{background:#dba467}.bunny .head{background:#f3e1c8}.ear{position:absolute;width:23px;height:48px;border-radius:60% 60% 35% 35%;top:-19px}.bear .ear{background:#dba467}.bunny .ear{background:#f3e1c8}.ear:after{content:"";position:absolute;inset:8px 7px 9px;background:#efb0a4;border-radius:inherit}.bear .ear:first-child,.bunny .ear:first-child{left:3px;transform:rotate(-18deg)}.bear .ear:nth-child(2),.bunny .ear:nth-child(2){right:3px;transform:rotate(18deg)}.eye{position:absolute;width:7px;height:9px;border-radius:50%;background:#46352e;top:40px}.eye.l{left:28px}.eye.r{right:28px}.nose{position:absolute;width:9px;height:7px;border-radius:50%;background:#6c4030;left:32px;top:51px}.mouth{position:absolute;left:34px;top:58px;width:12px;height:7px;border-bottom:2px solid #6c4030;border-radius:0 0 50% 50%}.body{position:absolute;left:22px;top:79px;width:58px;height:54px;border-radius:28px 28px 18px 18px}.bear .body{background:#dba467}.bunny .body{background:#f3e1c8}.bunny .body:after{content:"";position:absolute;left:6px;top:10px;width:46px;height:28px;border-radius:12px;background:#8e827d}.arm{position:absolute;top:86px;width:25px;height:16px;border-radius:15px;background:inherit}.arm.l{left:7px;transform:rotate(25deg)}.arm.r{right:3px;transform:rotate(-18deg)}.bunny .body:before{content:"";position:absolute;left:14px;top:9px;width:30px;height:4px;background:#c4b7aa;box-shadow:0 8px #c4b7aa}.tabs{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.tab{height:50px;border-radius:18px;border:1px solid var(--line);background:#fffaf6;color:#a18b7c;font-size:14px;font-weight:800;letter-spacing:-.04em}.tab.active{background:var(--pink-soft);border-color:#ffd0cc;color:#e7777d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}.feed{padding:0 16px}.post{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow)}.post-head{display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#f8e8d9;flex:0 0 auto}.avatar .mini-bear,.avatar .mini-bunny{transform:scale(.48);transform-origin:center}.author{font-size:13px;font-weight:900}.author.g{color:#e27b80}.author.s{color:var(--blue)}.time{margin-left:auto;font-size:11px;color:#b09b8e}.more{font-size:18px;color:#b09b8e;padding:4px}.title{font-size:17px;font-weight:800;letter-spacing:-.055em;margin:13px 0 11px;line-height:1.4}.meta{display:flex;gap:18px;color:#b09b8e;font-size:12px;border-top:1px solid #f4e8df;padding-top:11px}.meta span{display:flex;align-items:center;gap:5px}.meta .love{color:#ef8d91}.write{position:sticky;bottom:16px;margin:14px 16px 0;height:54px;width:calc(100% - 32px);border-radius:20px;background:linear-gradient(135deg,#f69a9c,#f4868b);color:white;font-size:16px;font-weight:900;box-shadow:0 12px 24px rgba(239,133,139,.25)}.write:active{transform:translateY(1px)}.empty{display:none;text-align:center;padding:48px 20px;color:#a99284}.empty strong{display:block;color:#80695b;font-size:16px;margin-bottom:7px}.compose{display:none;position:fixed;inset:0;z-index:30;background:rgba(67,45,35,.3);align-items:flex-end}.sheet{width:100%;max-width:520px;margin:auto;background:#fffaf6;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(72,44,28,.15)}.sheet-top{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:19px;margin:0}.close{font-size:24px;color:#9b8475}.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 14px;outline:none;margin-top:14px}.field:focus{border-color:#f3b1af}.textarea{min-height:110px;resize:vertical}.author-pick{display:flex;gap:8px;margin-top:12px}.pick{flex:1;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:800}.pick.selected{background:var(--pink-soft);border-color:#ffc9c6}.submit{width:100%;height:48px;margin-top:12px;border-radius:15px;background:#f58f92;color:#fff;font-weight:900}@media(min-width:521px){body{background:#f1e7de}.app{background:var(--bg);box-shadow:0 0 50px rgba(77,52,35,.08)}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<a class="back" href="../" aria-label="곰라이프로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg><span>곰라이프</span></a>
<div class="top-title">♡ 우리 둘의 이야기 ♡</div>
<button class="heart" aria-label="우리 둘"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.4S4 15.5 4 9.2C4 6.5 5.9 5 8.1 5c1.5 0 3 .8 3.9 2.2C12.9 5.8 14.4 5 15.9 5 18.1 5 20 6.5 20 9.2c0 6.3-8 11.2-8 11.2Z"/></svg></button>
</header>
<section class="hero"><div class="sun"></div><div class="hero-copy"><small>GOMLIFE · PRIVATE STORY</small><h1>우리 둘만의<br>작은 공간 ♡</h1><p>오늘의 이야기를 하나씩 남겨두어요.</p></div><div class="couple" aria-hidden="true"><div class="bear"><div class="head"><i class="ear"></i><i class="ear"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i></div><div class="body"><i class="arm l"></i><i class="arm r"></i></div></div><div class="bunny"><div class="head"><i class="ear"></i><i class="ear"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i></div><div class="body"><i class="arm l"></i><i class="arm r"></i></div></div></div></section>
<nav class="tabs"><button class="tab active" data-author="지연">🐻 지연의 이야기</button><button class="tab" data-author="승수">🐰 승수의 이야기</button></nav>
<section class="feed" id="feed">
<article class="post" data-author="지연"><div class="post-head"><div class="avatar"><div class="mini-bear bear" style="transform:scale(.38)"><div class="head"><i class="ear"></i><i class="ear"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i></div><div class="body"></div></div></div><div><div class="author g">지연</div><div class="time">2시간 전</div></div><button class="more">···</button></div><div class="title">오늘 문득 생각난 것</div><div class="meta"><span class="love">♡ 5</span><span>○ 3</span></div></article>
<article class="post" data-author="승수"><div class="post-head"><div class="avatar"><div class="mini-bunny bunny" style="transform:scale(.38)"><div class="head"><i class="ear"></i><i class="ear"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i></div><div class="body"></div></div></div><div><div class="author s">승수</div><div class="time">5시간 전</div></div><button class="more">···</button></div><div class="title">오늘 있었던 일</div><div class="meta"><span class="love">♡ 3</span><span>○ 1</span></div></article>
<article class="post" data-author="지연"><div class="post-head"><div class="avatar"><div class="mini-bear bear" style="transform:scale(.38)"><div class="head"><i class="ear"></i><i class="ear"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i></div><div class="body"></div></div></div><div><div class="author g">지연</div><div class="time">어제</div></div><button class="more">···</button></div><div class="title">바람 좋은 저녁</div><div class="meta"><span class="love">♡ 6</span><span>○ 2</span></div></article>
<article class="post" data-author="승수"><div class="post-head"><div class="avatar"><div class="mini-bunny bunny" style="transform:scale(.38)"><div class="head"><i class="ear"></i><i class="ear"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i></div><div class="body"></div></div></div><div><div class="author s">승수</div><div class="time">어제</div></div><button class="more">···</button></div><div class="title">퇴근길에</div><div class="meta"><span class="love">♡ 4</span><span>○ 1</span></div></article>
</section>
<div class="empty" id="empty"><strong>아직 남겨진 이야기가 없어요.</strong>첫 번째 이야기를 남겨볼까요? ♡</div>
<button class="write" id="write">✏️ 이야기 남기기</button>
</main>
<div class="compose" id="compose"><div class="sheet"><div class="sheet-top"><h2>새 이야기</h2><button class="close" id="close">×</button></div><input class="field" id="postTitle" maxlength="60" placeholder="제목을 적어주세요"><textarea class="field textarea" id="postBody" placeholder="내용은 다음 단계에서 연결할 수 있어요."></textarea><div class="author-pick"><button class="pick selected" data-pick="지연">🐻 지연</button><button class="pick" data-pick="승수">🐰 승수</button></div><button class="submit" id="submit">임시로 남겨보기</button></div></div>
<script>
const tabs=[...document.querySelectorAll('.tab')],posts=[...document.querySelectorAll('.post')],empty=document.getElementById('empty');
function filter(author){tabs.forEach(t=>t.classList.toggle('active',t.dataset.author===author));let n=0;posts.forEach(p=>{const show=p.dataset.author===author;p.style.display=show?'block':'none';if(show)n++});empty.style.display=n?'none':'block'}
tabs.forEach(t=>t.addEventListener('click',()=>filter(t.dataset.author)));
const compose=document.getElementById('compose');document.getElementById('write').onclick=()=>compose.style.display='flex';document.getElementById('close').onclick=()=>compose.style.display='none';compose.addEventListener('click',e=>{if(e.target===compose)compose.style.display='none'});
document.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{document.querySelectorAll('.pick').forEach(x=>x.classList.remove('selected'));p.classList.add('selected')});
document.getElementById('submit').onclick=()=>{const title=document.getElementById('postTitle').value.trim();if(!title){document.getElementById('postTitle').focus();return}const author=document.querySelector('.pick.selected').dataset.pick;const article=document.createElement('article');article.className='post';article.dataset.author=author;article.innerHTML=`<div class="post-head"><div class="avatar">${author==='지연'?'🐻':'🐰'}</div><div><div class="author ${author==='지연'?'g':'s'}">${author}</div><div class="time">방금 전</div></div></div><div class="title"></div><div class="meta"><span class="love">♡ 0</span><span>○ 0</span></div>`;article.querySelector('.title').textContent=title;document.getElementById('feed').prepend(article);posts.push(article);compose.style.display='none';document.getElementById('postTitle').value='';filter(author)};
filter('지연');
</script>
</body></html>
