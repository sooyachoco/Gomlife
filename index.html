<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7ED" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./gomlife-icon.png" />
    <title>안녕? 곰지연씨</title>
    <style>


:root {
  --cream: #fbf7ed;
  --ivory: #fffdf7;
  --ink: #2f392f;
  --muted: #72806f;
  --sage: #c9d6c1;
  --sage-deep: #71826c;
  --sage-light: #e7eee1;
  --apricot: #f2b38e;
  --apricot-light: #f8ddc9;
  --border: #dde4d6;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #dfe6da;
  color: var(--ink);
  font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

.mobile-stage {
  min-height: 100svh;
  background:
    radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.92), transparent 30rem),
    linear-gradient(135deg, #dce5d8, #f2ddc9);
}

.paper-shell {
  position: relative;
  width: min(100%, 480px);
  min-height: 100svh;
  margin: 0 auto;
  overflow: hidden;
  background:
    radial-gradient(circle at 18px 14px, rgba(113, 130, 108, 0.055) 0 0.7px, transparent 0.9px),
    radial-gradient(circle at 7px 29px, rgba(242, 179, 142, 0.06) 0 0.6px, transparent 0.8px),
    var(--cream);
  background-size: 34px 38px, 41px 47px, auto;
  box-shadow: 0 0 80px rgba(54, 70, 50, 0.18);
}

.topbar {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(18px + env(safe-area-inset-top)) 20px 14px;
}

.brand,
.today {
  display: flex;
  align-items: center;
}

.brand {
  gap: 9px;
  margin: -10px;
  padding: 10px;
  border: 0;
  background: transparent;
  color: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.02em;
  cursor: pointer;
}

.brand:focus-visible {
  outline: 2px solid var(--sage-deep);
  outline-offset: 2px;
  border-radius: 10px;
}

.brand-mark {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 3px;
  width: 25px;
  height: 24px;
}

.brand-mark i {
  display: block;
  width: 6px;
  height: 16px;
  border: 2px solid var(--sage-deep);
  border-top: 0;
  border-radius: 0 0 8px 8px;
  transform: rotate(28deg);
}

.brand-mark i:nth-child(2) {
  height: 21px;
  border-color: var(--apricot);
  transform: none;
}

.brand-mark i:nth-child(3) {
  border-color: #d6a76d;
  transform: rotate(-28deg);
}

.install-toast {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  width: max-content;
  max-width: calc(100% - 40px);
  padding: 11px 16px;
  border-radius: 999px;
  background: rgba(47, 57, 47, 0.92);
  color: #fffdf7;
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  transform: translateX(-50%);
  box-shadow: 0 8px 24px rgba(47, 57, 47, 0.2);
}

.today {
  gap: 7px;
  margin: 0;
  color: #5f695d;
  font-size: 11px;
  font-weight: 600;
}

.sun {
  color: #d99056;
  font-size: 20px;
  line-height: 1;
}

.hero {
  position: relative;
  min-height: 126px;
  padding: 48px 24px 12px;
  text-align: center;
}

.hero::before,
.hero::after {
  position: absolute;
  z-index: 0;
  width: 180px;
  height: 230px;
  border-radius: 50%;
  background: rgba(201, 214, 193, 0.35);
  content: "";
  filter: blur(1px);
}

.hero::before {
  top: 40px;
  left: -126px;
  transform: rotate(-28deg);
}

.hero::after {
  top: 88px;
  right: -148px;
  background: rgba(248, 221, 201, 0.42);
  transform: rotate(22deg);
}

.hero > * {
  position: relative;
  z-index: 1;
}

.hero-leaf {
  position: absolute;
  top: 10px;
  left: 50%;
  color: var(--sage-deep);
  font-family: Georgia, serif;
  font-size: 42px;
  transform: translateX(-50%) rotate(-12deg);
}

.kicker {
  margin: 0 0 16px;
  color: var(--sage-deep);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.24em;
}

.hero h1 {
  margin: 0;
  font-size: clamp(39px, 11vw, 54px);
  font-weight: 850;
  letter-spacing: -0.07em;
  line-height: 1.12;
}

.hero h1 em {
  position: relative;
  color: var(--sage-deep);
  font-style: normal;
}

.hero h1 em::after {
  position: absolute;
  right: 1px;
  bottom: -8px;
  left: 4px;
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--sage), var(--apricot));
  content: "";
  opacity: 0.8;
}

.intro {
  margin: 27px 0 0;
  color: #657062;
  font-size: 15px;
  letter-spacing: -0.03em;
  line-height: 1.8;
}

.path-line {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 30px auto 0;
}

.path-line span {
  width: 52px;
  border-top: 1.5px dashed #a5b49d;
}

.path-line b {
  width: 8px;
  height: 8px;
  margin: 0 5px;
  border: 2px solid var(--cream);
  border-radius: 50%;
  background: var(--sage-deep);
  box-shadow: 0 0 0 1px var(--sage);
}

.path-line b:nth-of-type(2) {
  background: var(--apricot);
  box-shadow: 0 0 0 1px var(--apricot-light);
}

.path-list {
  display: grid;
  gap: 18px;
  padding: 2px 18px calc(28px + env(safe-area-inset-bottom));
}

.path-card {
  position: relative;
  display: block;
  overflow: hidden;
  min-height: 236px;
  border: 1px solid rgba(113, 130, 108, 0.25);
  border-radius: 30px;
  background: rgba(255, 253, 247, 0.93);
  box-shadow: 0 15px 35px rgba(77, 91, 71, 0.1);
  animation: card-in 560ms both;
  animation-delay: calc(120ms + var(--order) * 90ms);
  scroll-margin-top: 16px;
  transition: border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
}

.path-card:focus-visible {
  outline: 3px solid var(--apricot);
  outline-offset: 3px;
}

.path-card:active {
  transform: scale(0.985);
}

.card-art {
  position: relative;
  height: 140px;
  overflow: hidden;
  background: var(--ivory);
}

.card-art::after {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 35px;
  background: linear-gradient(transparent, var(--ivory));
  content: "";
}

.card-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  mix-blend-mode: multiply;
  transform: scale(1.01);
  transition: transform 500ms cubic-bezier(0.2, 0.75, 0.25, 1);
}

.card-number {
  position: absolute;
  z-index: 2;
  top: 18px;
  left: 20px;
  display: grid;
  width: 31px;
  height: 31px;
  place-items: center;
  border: 1px solid rgba(113, 130, 108, 0.25);
  border-radius: 50%;
  background: rgba(255, 253, 247, 0.82);
  color: var(--sage-deep);
  font-family: Georgia, serif;
  font-size: 10px;
}

.card-copy {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 15px 20px 21px 22px;
}

.card-copy p {
  margin: 0 0 3px;
  color: var(--sage-deep);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.19em;
}

.path-card.apricot .card-copy p {
  color: #c47747;
}

.card-copy h2 {
  margin: 0 0 3px;
  font-size: 27px;
  font-weight: 850;
  letter-spacing: -0.06em;
  line-height: 1.2;
}

.card-copy > div > span {
  color: var(--muted);
  font-size: 13px;
}

.arrow {
  display: grid;
  flex: 0 0 auto;
  width: 50px;
  height: 50px;
  place-items: center;
  border-radius: 50%;
  background: var(--sage-light);
  color: #40523c;
  font-size: 24px;
  transition: background 220ms ease, transform 220ms ease;
}

.path-card.apricot .arrow {
  background: var(--apricot-light);
}

.path-card:hover {
  border-color: rgba(113, 130, 108, 0.48);
  box-shadow: 0 20px 40px rgba(77, 91, 71, 0.15);
  transform: translateY(-4px);
}

.path-card:hover img {
  transform: scale(1.045);
}

.path-card:hover .arrow {
  transform: translateX(4px);
}

footer {
  position: relative;
  margin: 18px 18px 0;
  padding: 58px 20px calc(62px + env(safe-area-inset-bottom));
  overflow: hidden;
  border-radius: 160px 160px 0 0;
  background: var(--sage-light);
  text-align: center;
}

footer::before,
footer::after {
  position: absolute;
  width: 78px;
  height: 140px;
  border: 1px solid rgba(113, 130, 108, 0.2);
  border-radius: 50%;
  content: "";
}

footer::before {
  bottom: -90px;
  left: 32px;
  transform: rotate(35deg);
}

footer::after {
  right: 24px;
  bottom: -80px;
  transform: rotate(-32deg);
}

.sprig {
  display: inline-block;
  margin-bottom: 9px;
  color: var(--sage-deep);
  font-family: Georgia, serif;
  font-size: 29px;
  transform: rotate(24deg);
}

footer p {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 1.45;
}

footer small {
  display: block;
  margin-top: 12px;
  color: var(--muted);
  font-size: 10px;
}

.toast {
  position: fixed;
  z-index: 20;
  bottom: calc(22px + env(safe-area-inset-bottom));
  left: 50%;
  width: max-content;
  max-width: calc(100% - 40px);
  padding: 12px 18px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 999px;
  background: rgba(47, 57, 47, 0.9);
  color: white;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 16px);
  transition: opacity 200ms ease, transform 200ms ease;
  backdrop-filter: blur(12px);
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@keyframes card-in {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (min-width: 481px) {
  .mobile-stage {
    padding: 34px 0;
  }

  .paper-shell {
    min-height: calc(100svh - 68px);
    border-radius: 34px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
    </style>
  </head>
  <body>
    <main class="mobile-stage">
      <div class="paper-shell">
        <header class="topbar">
          <button class="brand" id="installButton" type="button" aria-label="Gomlife 앱 설치" title="앱 설치">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <p class="today">
            <span class="sun" aria-hidden="true">✺</span>
            <span id="today">오늘</span>
          </p>
        </header>

        <section class="path-list" aria-label="기록 공간 선택">
          <a class="path-card sage" href="https://sooyachoco.github.io/schedule/" id="diary" style="--order: 0">
            <div class="card-art">
              <span class="card-number">01</span>
              <img src="./images/image-01-1a6f0db988.png" alt="" />
            </div>
            <div class="card-copy">
              <div><p>PLAN</p><h2>다이어리</h2><span>하루를 계획해요</span></div>
              <span class="arrow" aria-hidden="true">→</span>
            </div>
          </a>

          <a class="path-card apricot" href="https://sooyachoco.github.io/GomDiary/" id="journal" style="--order: 1">
            <div class="card-art">
              <span class="card-number">02</span>
              <img src="./images/image-02-657389e449.png" alt="" />
            </div>
            <div class="card-copy">
              <div><p>WRITE</p><h2>일기장</h2><span>마음을 기록해요</span></div>
              <span class="arrow" aria-hidden="true">→</span>
            </div>
          </a>

          <a class="path-card sage" href="https://sooyachoco.github.io/GomMap/" id="map" style="--order: 2">
            <div class="card-art">
              <span class="card-number">03</span>
              <img src="./images/image-03-c09c0a68e1.png" alt="" />
            </div>
            <div class="card-copy">
              <div><p>TASTE</p><h2>맛집지도</h2><span>맛있는 기억을 모아요</span></div>
              <span class="arrow" aria-hidden="true">→</span>
            </div>

              <img src="./images/image-04-2f21de1c19.png" alt="단어장과 단어 카드가 놓인 수채화 일러스트" />
            </div>

            </div>
            <div class="card-copy">
              <div><p>COOK</p><h2>곰레시피</h2><span>맛있는 레시피를 모아요</span></div>
              <span class="arrow" aria-hidden="true">→</span>
            </div>
          </a>
        </section>
      </div>
    </main>

    <div class="install-toast" id="installToast" role="status" aria-live="polite" hidden></div>
    </div>


    <script>
      const today = new Intl.DateTimeFormat("ko-KR", {
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(new Date());
      document.querySelector("#today").textContent = today;

      const installButton = document.querySelector("#installButton");
      const installToast = document.querySelector("#installToast");
      let deferredInstallPrompt = null;
      let toastTimer = null;

      const showInstallToast = (message) => {
        window.clearTimeout(toastTimer);
        installToast.textContent = message;
        installToast.hidden = false;
        toastTimer = window.setTimeout(() => {
          installToast.hidden = true;
        }, 2200);
      };

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
      });

      installButton.addEventListener("click", async () => {
        if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
          showInstallToast("이미 홈 화면에 추가되어 있어요");
          return;
        }

        if (deferredInstallPrompt) {
          await deferredInstallPrompt.prompt();
          const choice = await deferredInstallPrompt.userChoice;
          deferredInstallPrompt = null;
          if (choice.outcome === "accepted") {
            showInstallToast("Gomlife를 홈 화면에 추가했어요");
          }
          return;
        }

        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          showInstallToast("공유 → ‘홈 화면에 추가’를 눌러 주세요");
          return;
        }

        showInstallToast("브라우저 메뉴에서 ‘앱 설치’를 선택해 주세요");
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {
          showInstallToast("앱 설치 기능을 준비하지 못했어요");
        });
      }
    </script>
  <script data-gomlife-community-script>
(function(){
  function add(){
    const nodes=[...document.querySelectorAll('body *')];
    const label=nodes.find(el=>el.children.length===0 && /일기/.test(el.textContent.trim()));
    if(!label || document.querySelector('[data-gomlife-community]')) return;
    let card=label;
    for(let i=0;i<10 && card.parentElement;i++){
      const parent=card.parentElement;
      const same=[...parent.children].filter(x=>x.tagName===card.tagName && x.className===card.className);
      if(same.length>=2) break;
      card=parent;
    }
    const clone=card.cloneNode(true);
    clone.setAttribute('data-gomlife-community','true');
    const walker=document.createTreeWalker(clone,NodeFilter.SHOW_TEXT);
    const texts=[]; while(walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(n=>{
      const t=n.nodeValue.trim();
      if(/일기/.test(t)) n.nodeValue=n.nodeValue.replace(t,'우리 커뮤니티');
      else if(t==='오늘의 기록') n.nodeValue=n.nodeValue.replace('오늘의 기록','오늘 하루 어땠어?');
      else if(t==='매일의 이야기를 기록해요') n.nodeValue=n.nodeValue.replace('매일의 이야기를 기록해요','오늘 하루 어땠어?');
    });
    clone.querySelectorAll('a').forEach(a=>a.href='https://community.sooyachoco.workers.dev');
    if(clone.tagName==='A') clone.href='https://community.sooyachoco.workers.dev';
    card.parentElement.appendChild(clone);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',add); else add();
})();
</script>
