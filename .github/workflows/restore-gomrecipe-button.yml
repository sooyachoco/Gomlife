name: Restore bottom chat banner

on:
  workflow_run:
    workflows: ["Sync Gomlife from gomlife2"]
    types: [completed]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore bottom chat banner and remove stray text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the extra bottom Gomrecipe link previously injected by the restore workflow.
          s = re.sub(r'<style\s+id=["\']gomrecipe-link-style["\'][^>]*>.*?</style>\s*<a\s+id=["\']gomrecipe-link["\'][^>]*>.*?</a>', '', s, flags=re.I|re.S)
          s = re.sub(r'\\n\\n\s*[🔍🍳]\s*곰레시피\\n', '', s)
          s = re.sub(r'(?<![가-힣])\\n\\n\s*[🔍🍳]\s*곰레시피\\n', '', s)

          banner = '''<a id="gomchat-bottom-banner" href="https://gomchat.sooyachoco.workers.dev" style="display:block;text-decoration:none;margin:24px 16px 32px;padding:16px 20px;border:1px solid #eadfd5;border-radius:16px;background:#fffaf5;color:#49382f;text-align:center;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(73,56,47,.06);box-sizing:border-box;">💬 편안하게 대화해요 <span style="font-size:12px;font-weight:600;opacity:.65;">곰채팅으로 이동</span></a>'''

          # Remove a previous chat banner so repeated sync runs never duplicate it.
          s = re.sub(r'<a\s+id=["\']gomchat-bottom-banner["\'][^>]*>.*?</a>', '', s, flags=re.I|re.S)

          # Replace the final image-based banner (the 2027 Susi/banner image) with chat.
          pattern = re.compile(r'<a\b[^>]*>(?:(?!</a>).)*?<img\b[^>]*>(?:(?!</a>).)*?</a>', re.I|re.S)
          matches = list(pattern.finditer(s))
          if matches:
              m = matches[-1]
              s = s[:m.start()] + banner + s[m.end():]
          else:
              # If the source sync no longer has an image banner, append chat once before body end.
              s = s.replace('</body>', banner + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: restore bottom chat banner"
            git push origin main
          fi
