name: Deploy Gomlife with chat banner

on:
  workflow_run:
    workflows: ["Sync Gomlife from gomlife2"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current Gomlife
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve source layout and append chat banner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove only the recipe button previously injected by this workflow.
          # The real Gomrecipe card/button from gomlife2 must remain untouched.
          s = re.sub(r'<a\b[^>]*id=["\']gomrecipe-link["\'][\s\S]*?</a>\s*', '', s, count=1, flags=re.I)

          # Remove any previously injected bottom chat banner.
          s = re.sub(r'<a\b[^>]*id=["\']gomchat-bottom-banner["\'][\s\S]*?</a>\s*', '', s, count=1, flags=re.I)

          # Remove the old Susi banner only by its stable container id.
          s = re.sub(r'<div\b[^>]*id=["\']susi2027-banner["\'][\s\S]*?</div>\s*', '', s, count=1, flags=re.I)

          banner = '''<a id="gomchat-bottom-banner" href="https://gomchat.sooyachoco.workers.dev" style="display:block;text-decoration:none;margin:18px 16px 32px;padding:16px 20px;border:1px solid #eadfd5;border-radius:16px;background:#fffaf5;color:#49382f;text-align:center;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(73,56,47,.06);box-sizing:border-box;">💬 편안하게 대화해요 <span style="font-size:12px;font-weight:600;opacity:.65;">곰채팅으로 이동</span></a>'''

          pos = s.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('index.html has no closing body tag')
          s = s[:pos] + banner + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No UI changes"
          else
            git commit -m "fix: preserve original Gomrecipe card"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
