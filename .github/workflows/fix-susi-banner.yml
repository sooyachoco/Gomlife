name: Deploy Gomlife with chat banner

on:
  workflow_run:
    workflows: ["Sync Gomlife from gomlife2"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current Gomlife
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace bottom banner with chat link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          banner = '''<a href="https://gomchat.sooyachoco.workers.dev" style="display:block;text-decoration:none;margin:24px 16px 32px;padding:16px 20px;border:1px solid #eadfd5;border-radius:16px;background:#fffaf5;color:#49382f;text-align:center;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(73,56,47,.06);">💬 편안하게 대화해요 <span style="font-size:12px;font-weight:600;opacity:.65;">곰채팅으로 이동</span></a>'''

          # Remove the existing bottom Susi banner by its stable id when present.
          s, removed = re.subn(r'<div id=["\']susi2027-banner["\'][\s\S]*?</div>\s*', '', s, count=1, flags=re.I)
          if removed:
              print('Removed existing susi2027 banner')

          # Also remove a final image-based anchor if the source sync inserted one without the id.
          pattern = re.compile(r'<a\b[^>]*>(?:(?!</a>).)*?<img\b[^>]*>(?:(?!</a>).)*?</a>', re.I | re.S)
          matches = list(pattern.finditer(s))
          if matches:
              m = matches[-1]
              tail = s[m.start():m.end()]
              if 'susi2027' in tail.lower() or '2027' in tail.lower() or '수시' in tail:
                  s = s[:m.start()] + s[m.end():]
                  print('Removed final Susi image anchor')

          pos = s.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('index.html has no closing body tag')
          s = s[:pos] + banner + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit banner change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No banner changes"
          else
            git commit -m "ui: replace bottom banner with chat link"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
